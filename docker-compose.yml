services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sagalab
      POSTGRES_PASSWORD: sagalab
      POSTGRES_DB: sagalab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagalab -d sagalab"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: sagalab
      RABBITMQ_DEFAULT_PASS: sagalab
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
