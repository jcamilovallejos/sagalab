<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <text x="600" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">
    Inyección de fallos — de X-Fault-Inject a StubPaymentProvider (Fase 2, sagalab)
  </text>

  <!-- ===== Cadena vertical superior ===== -->
  <rect x="250" y="48" width="700" height="42" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="600" y="74" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">
    header: X-Fault-Inject: charge:flaky(2)
  </text>

  <line x1="600" y1="90" x2="600" y2="112" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>

  <rect x="250" y="114" width="700" height="42" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="600" y="140" text-anchor="middle" font-size="12" fill="#1e1b4b">
    middleware/fault-inject.ts → parseFaultInjectionHeader()
  </text>

  <line x1="600" y1="156" x2="600" y2="178" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>

  <rect x="250" y="180" width="700" height="42" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="600" y="206" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">
    req.faultInjection = { charge: { kind: 'flaky', n: 2 } }
  </text>

  <line x1="600" y1="222" x2="600" y2="244" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>

  <rect x="250" y="246" width="700" height="42" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="600" y="272" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">
    ChargeRequest { paymentId, amountCents, idempotencyKey, fault }
  </text>

  <line x1="600" y1="288" x2="600" y2="310" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>

  <rect x="250" y="312" width="700" height="42" rx="8" fill="#111827" stroke="#111827"/>
  <text x="600" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">
    StubPaymentProvider.charge(request) — switch (fault.kind)
  </text>

  <!-- ===== Bus horizontal hacia las 7 ramas ===== -->
  <line x1="600" y1="354" x2="600" y2="378" stroke="#374151" stroke-width="1.5"/>
  <line x1="105" y1="378" x2="1095" y2="378" stroke="#374151" stroke-width="1.5"/>

  <!-- posiciones x de cada caja (centro): 105,270,435,600,765,930,1095 -->
  <line x1="105" y1="378" x2="105" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>
  <line x1="270" y1="378" x2="270" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>
  <line x1="435" y1="378" x2="435" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>
  <line x1="600" y1="378" x2="600" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>
  <line x1="765" y1="378" x2="765" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>
  <line x1="930" y1="378" x2="930" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>
  <line x1="1095" y1="378" x2="1095" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#fi-arrow)"/>

  <!-- ===== Las 7 ramas ===== -->
  <!-- 1. ok -->
  <rect x="30" y="400" width="150" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="105" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">ok</text>
  <text x="105" y="436" text-anchor="middle" font-size="10" fill="#047857">aprueba de</text>
  <text x="105" y="448" text-anchor="middle" font-size="10" fill="#047857">inmediato</text>

  <!-- 2. declined -->
  <rect x="195" y="400" width="150" height="72" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="270" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">declined</text>
  <text x="270" y="436" text-anchor="middle" font-size="10" fill="#4b5563">DeclinedError</text>
  <text x="270" y="448" text-anchor="middle" font-size="10" fill="#4b5563">nunca reintentable</text>

  <!-- 3. error500 -->
  <rect x="360" y="400" width="150" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="435" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">error500</text>
  <text x="435" y="436" text-anchor="middle" font-size="10" fill="#c2410c">ServerError</text>
  <text x="435" y="448" text-anchor="middle" font-size="10" fill="#c2410c">reintentable</text>

  <!-- 4. slow(ms) -->
  <rect x="525" y="400" width="150" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">slow(ms) ⏱</text>
  <text x="600" y="436" text-anchor="middle" font-size="10" fill="#047857">clock.sleep(ms)</text>
  <text x="600" y="448" text-anchor="middle" font-size="10" fill="#047857">luego aprueba</text>

  <!-- 5. timeout(ms) -->
  <rect x="690" y="400" width="150" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="765" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">timeout(ms) ⏱</text>
  <text x="765" y="436" text-anchor="middle" font-size="10" fill="#c2410c">clock.sleep(ms)</text>
  <text x="765" y="448" text-anchor="middle" font-size="10" fill="#c2410c">luego TimeoutError</text>

  <!-- 6. flaky(n) -->
  <rect x="855" y="400" width="150" height="72" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="930" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">flaky(n)</text>
  <text x="930" y="436" text-anchor="middle" font-size="10" fill="#4338ca">falla n veces por</text>
  <text x="930" y="448" text-anchor="middle" font-size="10" fill="#4338ca">idempotencyKey</text>

  <!-- 7. charged_but_timeout -->
  <rect x="1020" y="400" width="150" height="72" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1095" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">charged_but</text>
  <text x="1095" y="431" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">_timeout</text>
  <text x="1095" y="446" text-anchor="middle" font-size="9.5" fill="#6d28d9">cobra + nunca</text>
  <text x="1095" y="457" text-anchor="middle" font-size="9.5" fill="#6d28d9">resuelve la promesa</text>

  <!-- ===== Notas ===== -->
  <rect x="30" y="495" width="1140" height="150" rx="8" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="50" y="518" font-size="12" font-weight="700" fill="#111827">Notas</text>

  <text x="50" y="540" font-size="11" fill="#374151">
    • <tspan font-weight="700">flaky(n)</tspan> — cuenta intentos en un Map interno por idempotencyKey. Intentos 1..n: ServerError. Intento n+1: aprueba. Otra idempotencyKey arranca su propio contador en 0.
  </text>
  <text x="50" y="560" font-size="11" fill="#374151">
    • <tspan font-weight="700">charged_but_timeout</tspan> — registra la idempotencyKey en un Set interno (wasChargedDespiteTimeout) ANTES de devolver una promesa que nunca se resuelve ni rechaza. Es el caso perverso: el dinero se movió pero el llamador no tiene forma de saberlo por la respuesta.
  </text>
  <text x="50" y="580" font-size="11" fill="#374151">
    • <tspan font-weight="700">slow / timeout</tspan> usan <tspan font-family="monospace">clock.sleep(ms)</tspan> — con FakeClock en tests, esa espera no consume tiempo real: solo avanza cuando el test llama <tspan font-family="monospace">clock.advance(ms)</tspan> a mano.
  </text>
  <text x="50" y="602" font-size="11" fill="#374151">
    • Verde = éxito · Gris = fallo terminal (nunca reintentar) · Naranja = fallo reintentable (fase 4) · Azul/morado = comportamiento con estado interno.
  </text>
  <text x="50" y="624" font-size="11" fill="#374151">
    • Si el request no trae <tspan font-family="monospace">fault</tspan> (undefined), el stub asume <tspan font-family="monospace">{ kind: 'ok' }</tspan> por defecto.
  </text>
</svg>
