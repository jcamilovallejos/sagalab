<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ik-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>

  <text x="600" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">
    Idempotency Key — reserve() / complete() sobre idempotency_keys (Fase 3, sagalab)
  </text>

  <!-- ===== Cadena vertical superior ===== -->
  <rect x="250" y="48" width="700" height="42" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="600" y="74" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">
    POST /widgets · Idempotency-Key: key-1 · { amount: 100 }
  </text>

  <line x1="600" y1="90" x2="600" y2="112" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>

  <rect x="250" y="114" width="700" height="42" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="600" y="140" text-anchor="middle" font-size="12" fill="#1e1b4b">
    middleware/idempotency.ts → hashRequest(body): sha256 con claves canonicalizadas
  </text>

  <line x1="600" y1="156" x2="600" y2="178" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>

  <rect x="250" y="180" width="700" height="50" rx="8" fill="#111827" stroke="#111827"/>
  <text x="600" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">
    repo.reserve({ key, endpoint, requestHash, expiresAt })
  </text>
  <text x="600" y="217" text-anchor="middle" font-size="10.5" fill="#d1d5db">
    INSERT ... PRIMARY KEY (key, endpoint) arbitra — nunca SELECT + INSERT
  </text>

  <!-- ===== Split reserved / conflict ===== -->
  <line x1="600" y1="230" x2="600" y2="250" stroke="#374151" stroke-width="1.5"/>
  <line x1="350" y1="250" x2="850" y2="250" stroke="#374151" stroke-width="1.5"/>
  <line x1="350" y1="250" x2="350" y2="270" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>
  <line x1="850" y1="250" x2="850" y2="270" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>

  <rect x="275" y="272" width="150" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="350" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">reserved</text>
  <text x="350" y="310" text-anchor="middle" font-size="10" fill="#047857">el INSERT ganó</text>

  <rect x="775" y="272" width="150" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="850" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">conflict</text>
  <text x="850" y="310" text-anchor="middle" font-size="10" fill="#4b5563">ya existe (key, endpoint)</text>

  <!-- ===== Rama reserved: baja en columna izquierda ===== -->
  <line x1="350" y1="328" x2="350" y2="350" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>

  <rect x="270" y="350" width="160" height="62" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="350" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e1b4b">interceptResponse()</text>
  <text x="350" y="385" text-anchor="middle" font-size="9.5" fill="#4338ca">envuelve res.json/send</text>
  <text x="350" y="398" text-anchor="middle" font-size="9.5" fill="#4338ca">y llama next()</text>

  <line x1="350" y1="412" x2="350" y2="434" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>

  <rect x="270" y="434" width="160" height="46" rx="8" fill="#111827" stroke="#111827"/>
  <text x="350" y="462" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">handler ejecuta el efecto</text>

  <line x1="350" y1="480" x2="350" y2="502" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>

  <rect x="245" y="502" width="210" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="350" y="522" text-anchor="middle" font-size="11.5" font-weight="700" fill="#064e3b">res.json(body) / res.send(body)</text>
  <text x="350" y="538" text-anchor="middle" font-size="9.5" fill="#047857">complete() → UPDATE idempotency_keys</text>
  <text x="350" y="551" text-anchor="middle" font-size="9.5" fill="#047857">SET status='done', response_status,</text>
  <text x="350" y="564" text-anchor="middle" font-size="9.5" fill="#047857">response_body</text>

  <!-- ===== Rama conflict: 3 sub-ramas ===== -->
  <line x1="850" y1="328" x2="850" y2="350" stroke="#374151" stroke-width="1.5"/>
  <line x1="650" y1="350" x2="1050" y2="350" stroke="#374151" stroke-width="1.5"/>
  <line x1="650" y1="350" x2="650" y2="370" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>
  <line x1="850" y1="350" x2="850" y2="370" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>
  <line x1="1050" y1="350" x2="1050" y2="370" stroke="#374151" stroke-width="1.5" marker-end="url(#ik-arrow)"/>

  <rect x="575" y="370" width="150" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="650" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c2d12">hash distinto</text>
  <text x="650" y="406" text-anchor="middle" font-size="10" fill="#c2410c">422</text>
  <text x="650" y="420" text-anchor="middle" font-size="9" fill="#c2410c">misma llave, payload</text>
  <text x="650" y="431" text-anchor="middle" font-size="9" fill="#c2410c">distinto</text>

  <rect x="775" y="370" width="150" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="850" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937">mismo hash</text>
  <text x="850" y="406" text-anchor="middle" font-size="10" fill="#4b5563">status: in_progress</text>
  <text x="850" y="420" text-anchor="middle" font-size="9" fill="#4b5563">409 — no espera</text>
  <text x="850" y="431" text-anchor="middle" font-size="9" fill="#4b5563">bloqueado</text>

  <rect x="975" y="370" width="150" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1050" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">mismo hash</text>
  <text x="1050" y="406" text-anchor="middle" font-size="10" fill="#6d28d9">status: done</text>
  <text x="1050" y="420" text-anchor="middle" font-size="9" fill="#6d28d9">réplay: mismo response,</text>
  <text x="1050" y="431" text-anchor="middle" font-size="9" fill="#6d28d9">sin re-ejecutar el efecto</text>

  <!-- ===== Notas ===== -->
  <rect x="30" y="605" width="1140" height="155" rx="8" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="50" y="628" font-size="12" font-weight="700" fill="#111827">Notas</text>

  <text x="50" y="650" font-size="11" fill="#374151">
    • <tspan font-weight="700">request_hash</tspan> se calcula con las claves de cada objeto ordenadas alfabéticamente (canonicalize()) — el mismo payload con las claves en otro orden no dispara un 422 falso.
  </text>
  <text x="50" y="670" font-size="11" fill="#374151">
    • <tspan font-weight="700">reserved</tspan> corre el handler y recién <tspan font-family="monospace">entonces</tspan> marca 'done'. Si la conexión muere antes de que algo llame a res.json/res.send (el caso charged_but_timeout), la fila queda 'in_progress' hasta que expires_at la purgue — esta capa no resuelve esa ambigüedad, es trabajo de la fase 6.
  </text>
  <text x="50" y="692" font-size="11" fill="#374151">
    • <tspan font-weight="700">PostgresIdempotencyRepository</tspan>: INSERT primero, catch de la violación 23505 (unique_violation) después — nunca SELECT+INSERT, esa es exactamente la carrera que el patrón cierra.
  </text>
  <text x="50" y="714" font-size="11" fill="#374151">
    • <tspan font-weight="700">InMemoryIdempotencyRepository</tspan> no puede demostrar esta carrera: un Map de un solo proceso no reproduce dos conexiones reales disputando la misma fila. Solo sirve para tests unitarios rápidos de la lógica 409/422/réplay.
  </text>
  <text x="50" y="736" font-size="11" fill="#374151">
    • <tspan font-family="monospace">endpoint</tspan> se pasa explícito al montar el middleware (ej. 'POST /checkout'), nunca inferido de req.path — evita fragmentar la PRIMARY KEY compuesta (key, endpoint) con rutas de params dinámicos.
  </text>
  <text x="50" y="756" font-size="11" fill="#374151">
    • Verde = camino feliz / éxito · Gris = conflicto terminal para este request (409) · Naranja = payload inválido (422) · Morado = réplay de una respuesta ya resuelta.
  </text>
</svg>
